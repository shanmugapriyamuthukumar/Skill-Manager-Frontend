<!-- Application Overview -->


<!-- Dashboard Cards -->
<div class="dashboard-cards">
  <!-- Project Count Card -->
  <div class="count-card" (click)="goToProjects()">
    <h3>📂 Projects</h3>
    <p class="count">{{ projectRequests.length }}</p>
    <span class="card-subtext">Total Projects</span>
  </div>

  <!-- Skill Count Card -->
  <div class="count-card" (click)="goToSkills()">
    <h3>🛠 Skills</h3>
    <p class="count">{{ skillRequests.length }}</p>
    <span class="card-subtext">Total Skills</span>
  </div>
</div>
